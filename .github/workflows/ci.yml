name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # No setup step and no vcvars. The preset names no generator, so CMake picks
      # the newest Visual Studio on the box and that generator finds its own
      # toolset. A plain step here has neither cl.exe nor ninja on PATH, so a
      # Ninja preset fails with "CMAKE_CXX_COMPILER not set", and pinning a VS
      # year fails the day the image moves: "Visual Studio 17 2022" stopped
      # resolving when windows-latest became windows-2025-vs2026.
      - name: Configure
        run: cmake --preset ci

      - name: Report the toolchain actually used
        shell: pwsh
        run: |
          Select-String -Path build/ci/CMakeCache.txt -Pattern '^CMAKE_GENERATOR:|^CMAKE_CXX_COMPILER:' |
            ForEach-Object { $_.Line }

      # /WX is on in this preset. A new warning stops the line here rather than
      # on somebody's machine.
      - name: Build
        run: cmake --build --preset ci

      # --config is required: the Visual Studio generator is multi-config, so the
      # install rule cannot infer which one to take.
      - name: Stage
        shell: pwsh
        run: |
          cmake --install build/ci --config RelWithDebInfo --prefix stage
          $exe = Get-Item stage/dockedconsole.exe
          "staged {0:N0} KB" -f ($exe.Length / 1KB)
          if (-not $exe.Length) { throw "install produced nothing" }

      # Static CRT, so the binary must not import a VC++ runtime. Catching this
      # here is the difference between a clean install and "the application was
      # unable to start correctly" on a machine without the redistributable.
      #
      # Scans the image itself rather than shelling out to dumpbin: locating
      # dumpbin means hardcoding a Visual Studio path, and a hardcoded VS year is
      # exactly what broke this pipeline when the runner image moved to VS 2026.
      - name: Check for a runtime dependency
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path "stage/dockedconsole.exe"))
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)

          # Positive control first. If the scan cannot see the imports we know are
          # there, it would report "no CRT" for any input at all, and a check that
          # cannot fail is worse than no check.
          $expected = [regex]::Matches($ascii, '(?i)\b(USER32|KERNEL32|SHELL32|ADVAPI32)\.dll') |
                      ForEach-Object { $_.Value.ToUpper() } | Sort-Object -Unique
          "import names visible to the scan: $($expected -join ', ')"
          if ($expected.Count -lt 4) {
            throw "the import scan found only $($expected.Count) of the 4 system DLLs this binary certainly imports, so it is not reading the import table"
          }

          $crt = [regex]::Matches($ascii, '(?i)(VCRUNTIME\d*\.dll|MSVCP\d+\.dll|api-ms-win-crt-[a-z0-9-]+\.dll|ucrtbase\.dll)') |
                 ForEach-Object { $_.Value } | Sort-Object -Unique
          if ($crt) {
            throw "the binary imports the C runtime ($($crt -join ', ')); the static CRT setting has been lost"
          }
          "no CRT import: statically linked"

      # The release job asserts the tag matches both version strings. Checking
      # they match each other on every push means a release never fails on a
      # mismatch that was introduced weeks earlier.
      - name: Check versions agree
        shell: pwsh
        run: |
          $toml  = (Select-String -Path installer.toml -Pattern '^\s*version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $major = (Select-String -Path cmake/DockVersion.cmake -Pattern 'DOCK_VERSION_MAJOR (\d+)').Matches[0].Groups[1].Value
          $minor = (Select-String -Path cmake/DockVersion.cmake -Pattern 'DOCK_VERSION_MINOR (\d+)').Matches[0].Groups[1].Value
          $patch = (Select-String -Path cmake/DockVersion.cmake -Pattern 'DOCK_VERSION_PATCH (\d+)').Matches[0].Groups[1].Value
          $cmake = "$major.$minor.$patch"
          $exe   = (Get-Item stage/dockedconsole.exe).VersionInfo.ProductVersion
          "installer.toml=$toml  DockVersion.cmake=$cmake  linked exe=$exe"
          if ($toml -ne $cmake) { throw "installer.toml $toml does not match DockVersion.cmake $cmake" }
          # Catches a stale generated resource, which is the one new failure mode
          # configure_file introduces.
          if ($exe -notlike "$cmake*") { throw "linked VERSIONINFO $exe does not match DockVersion.cmake $cmake" }
