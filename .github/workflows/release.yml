name: release

on:
  push:
    tags: ['v*']

env:
  # Pinned. A Forge release cannot silently change what this job produces.
  # v0.3.0 or later is required: [[options]], `when` and `as = "user"` are ignored
  # rather than rejected by older builds, which inverts them instead of disabling
  # them. This product uses all three.
  FORGE_VERSION: v0.3.0

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the installer version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $toml = (Select-String -Path installer.toml -Pattern '^\s*version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $csproj = (Select-String -Path DockedConsole.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          "tag=$tag  installer.toml=$toml  csproj=$csproj"
          if ($tag -ne $toml)   { throw "tag $tag does not match installer.toml $toml" }
          if ($tag -ne $csproj) { throw "tag $tag does not match DockedConsole.csproj $csproj" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Self contained, so an install carries no .NET runtime prerequisite.
      - name: Stage the payload
        shell: pwsh
        run: |
          dotnet publish -c Release -o stage
          Get-ChildItem stage | Format-Table Name, Length

      # Sign the payload BEFORE forging. Forge hashes payload members into the
      # container and extracts them verbatim, so an unsigned binary going in is still
      # unsigned on the installed machine. Signing the finished installer does nothing
      # for them.
      - name: Sign the payload
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: stage
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          # Certificates are valid for three days. Without the timestamp the signature
          # stops validating within the week.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the payload signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature stage/dockedconsole.exe
          "payload: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "payload is $($sig.Status)" }

      # lwstub.exe ships signed, which is what makes the embedded uninstaller signed
      # without a second signing pass here.
      # Locke-Werks/Forge is public, so the workflow's own token can read its releases
      # and no FORGE_TOKEN secret is needed. If Forge ever goes private again, this
      # needs a PAT with Contents: read on that repo instead.
      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge `
            --pattern '*.exe' --dir tools
          foreach ($name in 'lwforge.exe', 'lwstub.exe') {
            $sig = Get-AuthenticodeSignature "tools/$name"
            "$name : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "tools/$name is $($sig.Status)" }
          }

      # No --sign here. That flag shells out to scripts/sign.ps1 resolved against the
      # working directory, which only exists inside the Forge repo.
      - name: Forge the installer
        shell: pwsh
        run: |
          ./tools/lwforge.exe build `
            --config installer.toml `
            --payload stage `
            --stub tools/lwstub.exe `
            --out dist/DockedConsole-Setup.exe

      # Signed last, after resource stamping and the container append have rewritten
      # the image.
      - name: Sign the installer
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the installer
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/DockedConsole-Setup.exe
          "installer: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer is $($sig.Status)" }

          # Signing appended a certificate table after the container. This proves it
          # did not orphan the payload.
          ./tools/lwforge.exe inspect dist/DockedConsole-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "the signed installer cannot read its own container" }

      - name: Verify the option surface
        shell: pwsh
        run: |
          $report = & dist/DockedConsole-Setup.exe --check-only /O:autostart=on /O:start_menu=off 2>&1 | Out-String
          $code = $LASTEXITCODE
          $report

          # An option id the installer does not declare is a real defect and must fail.
          if ($report -match 'not declared|does not declare|unknown option') {
            throw "the installer rejected an option id it is supposed to declare`n$report"
          }

          # Any other non-zero here is the runner failing one of our preflights, which
          # is a property of the runner rather than a defect in the installer. The
          # os_build floor is Windows 11 and hosted runners are often Server builds.
          if ($code -ne 0) {
            Write-Host "::warning::--check-only exited $code, which is expected when the runner itself fails a preflight"
          }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/DockedConsole-Setup.exe `
            --repo "${{ github.repository }}" `
            --title "Docked Console ${{ github.ref_name }}" `
            --notes "Signed installer. Run it, and the terminal docks to the right edge of the primary display.

          Docked Console registers a Windows AppBar, so maximized windows stop at its edge instead of covering it. No title bar, no minimize, no close, no taskbar or Alt+Tab entry.

          Requires Windows 11. No .NET runtime needed: the binary is self contained.

          Getting out: type ``exit`` in the shell, use the tray icon, or run ``dockedconsole.exe --stop``.

          The publisher on the signature is Specter Point Intelligence, LLC, the parent organisation. That is expected."
